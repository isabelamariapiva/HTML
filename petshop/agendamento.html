<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Agendamento</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#ECEDD1] font-sans text-gray-800">

<!-- HEADER -->
<header class="bg-[#F4B8D7] px-8 py-3 flex justify-between items-center border-b-4 border-pink-400">

    <img src="imgs/logo.png" class="w-16 rounded-full">

    <nav class="space-x-6 font-semibold">
        <a href="inicio.html" class="hover:text-pink-600">Home</a>
        <a href="carro.html" class="hover:text-pink-600">Carros</a>
        <a href="#" class="hover:text-pink-600">Clientes</a>
        <a href="agendamento.html" class="hover:text-pink-600">Agendamentos</a>
    </nav>

    <a href="login.html">
        <img src="imgs/iconesPess.png" class="w-10 hover:scale-110 transition">
    </a>

</header>


<!-- FORMULÁRIO -->
<div class="flex justify-center items-center py-12">

    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-lg">

        <h2 class="text-2xl font-bold text-center mb-6">
            Agendamento de Carro
        </h2>

        <div class="space-y-4">

            <div>
                <label class="font-semibold">Data Reserva</label>
                <input type="date" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-pink-400 outline-none">
            </div>

            <div>
                <label class="font-semibold">Data Devolução</label>
                <input type="date" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-pink-400 outline-none">
            </div>

            <div>
                <label class="font-semibold">Horário</label>
                <input type="time" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-pink-400 outline-none">
            </div>

            <div>
                <label class="font-semibold">Cliente</label>
                <input type="text" placeholder="Digite seu nome" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-pink-400 outline-none">
            </div>

            <div>
                <label class="font-semibold">Carro</label>
                <input type="text" placeholder="Digite o carro" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-pink-400 outline-none">
            </div>

            <a href="agendado.html">
                <button class="w-full mt-4 bg-pink-400 text-white py-2 rounded-lg hover:bg-pink-600 transition">
                    Agendar
                </button>
            </a>

        </div>

    </div>

</div>

<!-- RESULTADO -->
<p id="resultado" class="text-center font-semibold"></p>


<!-- FOOTER -->
<footer class="bg-[#F4B8D7] text-center py-6 mt-10 border-t-4 border-pink-400">

    <div class="flex justify-center gap-6 mb-3">
        <a href="#" class="hover:text-pink-700">📸 Instagram</a>
        <a href="#" class="hover:text-pink-700">💬 WhatsApp</a>
        <a href="#" class="hover:text-pink-700">✉️ Email</a>
    </div>

    <p>© 2025 Biblioteca Jardim de Luz - Todos os direitos reservados</p>

</footer>

</body>
</html>
