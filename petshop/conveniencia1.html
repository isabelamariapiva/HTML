<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

</head>

<body class="bg-[#ECEDD1] text-gray-800 font-sans">

<header class="bg-[#F4B8D7] px-[30px] py-[10px] flex justify-between items-center border-b-[5px] border-[#fa8bc2] sticky top-0 z-50">
    
    <img src="imgs/logo.png" class="w-[70px] rounded-full cursor-pointer">

    <nav class="space-x-6 font-semibold">
        <a href="index.html" class="hover:text-pink-600 transition">Home</a>

    </nav>

    <img src="user.png" class="w-[45px] hover:scale-110 transition cursor-pointer">

</header>

<main class="flex justify-center items-center py-10 px-4">

    <div class="bg-white shadow-xl rounded-2xl max-w-4xl w-full p-6 flex flex-col md:flex-row gap-8">

      
        <div class="flex flex-col items-center">
            <img src="imgs/estetica.png" class="w-[320px] rounded-xl shadow-md">

                <img src="imgs/estetica.png" class="w-16 rounded-lg cursor-pointer hover:scale-105">
                <img src="imgs/estetica.png" class="w-16 rounded-lg cursor-pointer hover:scale-105">
                <img src="imgs/estetica.png" class="w-16 rounded-lg cursor-pointer hover:scale-105">
            </div>
        </div>

   
        <div class="flex flex-col justify-between flex-1">

            <div>
                <h2 class="text-3xl font-bold mb-2">Estética e Higiene</h2>

         
                <div class="flex items-center gap-1 text-yellow-400 mb-3">
                    ⭐⭐⭐⭐⭐
                    <span class="text-gray-500 text-sm ml-2">(4.9)</span>
                </div>

                <p class="text-gray-600 text-sm leading-relaxed">
                    Cuidamos da beleza e da limpeza do seu pet com todo carinho e produtos de qualidade. 
                    Inclui banho completo, tosa, corte de unhas, limpeza de ouvidos e hidratação dos pelos.
                </p>

              
                

         
            <div class="mt-6">

                <p class="text-3xl font-bold text-pink-500 mb-4">
                    R$ 139,90
                </p>

                <div class="flex gap-3">
                    <button class="bg-gray-400 text-white px-5 py-2 rounded-lg cursor-not-allowed">
                        Indisponível
                    </button>

                    <a href="carro.html" class="bg-pink-200 text-pink-700 px-5 py-2 rounded-lg hover:bg-pink-300 transition">
                        Voltar
                    </a>
                </div>

            </div>

        </div>

    </div>

</main>

<footer class="bg-[#F4B8D7] text-center py-6 border-t-[5px] border-pink-400 mt-5">
    <p class="text-sm">© 2026 Petshop Reino Animal</p>
</footer>
