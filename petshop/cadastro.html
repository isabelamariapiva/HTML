```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta • Reino Animal</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="bg-[#ECEDD1] text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="bg-[#F4B8D7] px-[30px] py-[7px] flex justify-between items-center border-b-[5px] border-[#fa8bc2] sticky top-0 z-50">

        <!-- LOGO -->
        <div>
            <img src="imgs/logo.png"
                class="w-[70px] rounded-full cursor-pointer">
        </div>

        <!-- MENU -->
        <nav class="space-x-6 font-semibold hidden md:block">

            <a href="index.html"
                class="hover:text-pink-600 transition">
                Home
            </a>

            <a href="index.html#servicos"
                class="hover:text-pink-600 transition">
                Serviços
            </a>

            <a href="agendamento.html"
                class="hover:text-pink-600 transition">
                Agendamentos
            </a>

        </nav>

        <!-- DIREITA -->
        <div class="flex items-center gap-4">

            <div class="flex items-center bg-white rounded-full px-3 py-2 shadow-md">

                <input type="text"
                    placeholder="Pesquisar..."
                    class="outline-none text-sm px-2 w-[120px] md:w-[180px]">

                <i class="fas fa-search text-gray-600"></i>

            </div>

            <a href="compra.html"
                class="bg-white p-3 rounded-full shadow-md hover:bg-pink-100 transition relative">

                <i class="fas fa-shopping-cart text-pink-500"></i>

                <span class="absolute -top-1 -right-1 bg-pink-500 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full">
                    0
                </span>

            </a>

        </div>

    </header>

    <!-- CADASTRO -->
    <main class="flex-1 flex justify-center items-center py-12 px-4">

        <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-lg">

            <h2 class="text-2xl font-bold text-center mb-6">
                Criar Conta
            </h2>

            <div class="space-y-4">

                <div>
                    <label class="font-semibold">
                        Nome Completo
                    </label>

                    <input
                        type="text"
                        placeholder="Digite seu nome completo"
                        class="w-full mt-1 p-3 border rounded-lg focus:ring-2 focus:ring-pink-400 outline-none">
                </div>

                <div>
                    <label class="font-semibold">
                        E-mail
                    </label>

                    <input
                        type="email"
                        placeholder="Digite seu e-mail"
                        class="w-full mt-1 p-3 border rounded-lg focus:ring-2 focus:ring-pink-400 outline-none">
                </div>

                <div>
                    <label class="font-semibold">
                        Telefone
                    </label>

                    <input
                        type="tel"
                        placeholder="(15) 99999-9999"
                        class="w-full mt-1 p-3 border rounded-lg focus:ring-2 focus:ring-pink-400 outline-none">
                </div>

                <div>
                    <label class="font-semibold">
                        Senha
                    </label>

                    <input
                        type="password"
                        placeholder="Crie uma senha"
                        class="w-full mt-1 p-3 border rounded-lg focus:ring-2 focus:ring-pink-400 outline-none">
                </div>

                <div>
                    <label class="font-semibold">
                        Confirmar Senha
                    </label>

                    <input
                        type="password"
                        placeholder="Digite novamente sua senha"
                        class="w-full mt-1 p-3 border rounded-lg focus:ring-2 focus:ring-pink-400 outline-none">
                </div>

                <button
                    class="w-full mt-4 bg-pink-400 text-white py-3 rounded-lg hover:bg-pink-600 transition">

                    Criar Conta

                </button>

                <p class="text-center text-gray-500 mt-4">

                    Já possui uma conta?

                    <a href="login.html"
                        class="text-pink-500 font-semibold hover:text-pink-700">

                        Entrar

                    </a>

                </p>

            </div>

        </div>

    </main>

    <!-- FOOTER -->
    <footer class="bg-[#F4B8D7] text-center py-6 border-t-[5px] border-pink-400">

        <p class="text-sm">
            © 2026 Petshop Reino Animal • Todos os direitos reservados
        </p>

    </footer>

</body>

</html>
```
