<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petshop Reino Animal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#ECEDD1] text-gray-800 font-sans min-h-screen flex flex-col">



    <header class="bg-[#F4B8D7] px-[30px] py-[7px] flex justify-between items-center border-b-[5px] border-[#fa8bc2] sticky top-0 z-50">
        
        <div>
            <img src="imgs/logo.png" class="w-[70px] rounded-full cursor-pointer">
        </div>
<nav class="space-x-6 font-semibold">
    <a href="index.html" class="hover:text-pink-600 transition">Home</a>
     <a href="index.html#servicos" class="hover:text-pink-600 transition">Serviços</a>
    <a href="agendamento.html" class="hover:text-pink-600 transition">Agendamentos</a>
</nav>

<div class="flex items-center bg-white rounded-full px-3 py-1 shadow-md">
    <input 
        type="text" 
        placeholder="Pesquisar..." 
        class="outline-none text-sm px-2 w-[120px] md:w-[180px]"
    >
    
    <svg xmlns="http://www.w3.org/2000/svg" 
         class="w-5 h-5 text-gray-600 cursor-pointer hover:text-pink-500"
         fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
              d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z" />
    </svg>
</div>



    </header>
<main class="flex-1 max-w-5xl mx-auto p-6 w-full">

  <div id="carrinho" class="space-y-4"></div>

  <!-- TOTAL -->
  <div class="mt-8 bg-white p-6 rounded-2xl shadow text-right">

    <p class="text-lg">Total:</p>

    <p class="text-3xl font-bold text-pink-500">
      R$ <span id="total">0,00</span>
    </p>

    <button onclick="finalizarCompra()"
      class="mt-4 bg-pink-400 hover:bg-pink-500 text-white px-6 py-3 rounded-2xl">

      Finalizar Compra
    </button>

  </div>

</main>

<script>

function getCarrinho() {
  return JSON.parse(localStorage.getItem("carrinho")) || [];
}

function salvarCarrinho(carrinho) {
  localStorage.setItem("carrinho", JSON.stringify(carrinho));
}

function renderizar() {

  let carrinho = getCarrinho();
  let div = document.getElementById("carrinho");

  div.innerHTML = "";

  let total = 0;

  carrinho.forEach((item, index) => {

    // garante quantidade
    if (!item.quantidade) item.quantidade = 1;

    total += item.preco * item.quantidade;

    div.innerHTML += `
      <div class="bg-white p-4 rounded-2xl shadow flex gap-4 items-center">

        <img src="${item.imagem}" class="w-24 h-24 object-cover rounded-xl">

        <div class="flex-1">

          <h2 class="font-bold">${item.nome}</h2>

          <p class="text-gray-500">${item.categoria}</p>

          <p class="text-pink-500 font-bold">
            R$ ${(item.preco * item.quantidade).toFixed(2)}
          </p>

          <!-- QUANTIDADE -->
          <div class="flex items-center gap-2 mt-2">

            <button onclick="diminuir(${index})"
              class="bg-gray-200 px-3 py-1 rounded-lg">
              -
            </button>

            <span class="font-bold">${item.quantidade}</span>

            <button onclick="aumentar(${index})"
              class="bg-pink-400 text-white px-3 py-1 rounded-lg">
              +
            </button>

          </div>

        </div>

        <button onclick="remover(${index})"
          class="bg-red-500 text-white px-3 py-2 rounded-xl">

          🗑️
        </button>

      </div>
    `;
  });

  document.getElementById("total").innerText =
    total.toFixed(2).replace(".", ",");

}

function aumentar(index) {
  let carrinho = getCarrinho();
  carrinho[index].quantidade++;
  salvarCarrinho(carrinho);
  renderizar();
}

function diminuir(index) {
  let carrinho = getCarrinho();

  if (carrinho[index].quantidade > 1) {
    carrinho[index].quantidade--;
  }

  salvarCarrinho(carrinho);
  renderizar();
}

function remover(index) {
  let carrinho = getCarrinho();
  carrinho.splice(index, 1);
  salvarCarrinho(carrinho);
  renderizar();
}

function finalizarCompra() {
  alert("Compra finalizada com sucesso 🐾");
  localStorage.removeItem("carrinho");
  renderizar();
}

renderizar();

</script>
