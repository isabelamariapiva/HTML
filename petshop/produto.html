<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petshop Reino Animal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#ECEDD1] text-gray-800 font-sans min-h-screen flex flex-col">

 <header class="bg-[#F4B8D7] px-[30px] py-[7px] flex justify-between items-center border-b-[5px] border-[#fa8bc2] sticky top-0 z-50">
        
        <div>
            <img src="imgs/logo.png" class="w-[70px] rounded-full cursor-pointer">
        </div>
<nav class="space-x-6 font-semibold">
    <a href="index.html" class="hover:text-pink-600 transition">Home</a>
     <a href="index.html#servicos" class="hover:text-pink-600 transition">Serviços</a>
    <a href="agendamento.html" class="hover:text-pink-600 transition">Agendamentos</a>
</nav>

<div class="flex items-center bg-white rounded-full px-3 py-1 shadow-md">
    <input 
        type="text" 
        placeholder="Pesquisar..." 
        class="outline-none text-sm px-2 w-[120px] md:w-[180px]"
    >
    
    <svg xmlns="http://www.w3.org/2000/svg" 
         class="w-5 h-5 text-gray-600 cursor-pointer hover:text-pink-500"
         fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
              d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z" />
    </svg>
</div>



    </header>


  <!-- CONTEÚDO -->
  <main class="max-w-5xl mx-auto p-8">

    <div class="bg-white rounded-3xl shadow-xl overflow-hidden grid md:grid-cols-2">

      <!-- FOTO -->
      <div>

        <img
          id="imagemProduto"
          class="w-full h-full object-cover"
        >

      </div>

      <!-- INFOS -->
      <div class="p-8 flex flex-col justify-center">

        <p class="text-pink-500 font-semibold mb-2">
          Produto
        </p>

        <h1
          id="nomeProduto"
          class="text-4xl font-bold mb-4">
        </h1>

        <p
          id="categoriaProduto"
          class="text-gray-500 text-lg mb-6">
        </p>

        <p class="text-gray-700 leading-relaxed mb-8">

          Produto premium para o seu pet ❤️
          Feito com muito carinho e qualidade
          para garantir conforto, diversão e bem-estar.

        </p>

        <button
          class="bg-pink-400 hover:bg-pink-500 text-white py-4 rounded-2xl text-lg transition">

          Comprar Agora
        </button>

      </div>

    </div>

  </main>

  <script>

    // PEGAR DADOS
    let nome = localStorage.getItem("produtoNome");
    let categoria = localStorage.getItem("produtoCategoria");
    let imagem = localStorage.getItem("produtoImagem");

    // MOSTRAR
    document.getElementById("nomeProduto").innerText = nome;
    document.getElementById("categoriaProduto").innerText = categoria;
    document.getElementById("imagemProduto").src = imagem;

  </script>

</body>
</html>

<footer class="bg-[#F4B8D7] text-center py-6 border-t-[5px] border-pink-400 mt-auto">
    <p class="text-sm">© 2026 Petshop Reino Animal • Todos os direitos reservados</p>
</footer>
