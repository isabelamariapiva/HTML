<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Compra</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>


    <header class="bg-[#F4B8D7] px-[30px] py-[7px] flex justify-between items-center border-b-[5px] border-[#fa8bc2] sticky top-0 z-50">
        
        <div>
            <img src="imgs/logo.png" class="w-[70px] rounded-full cursor-pointer">
        </div>
<nav class="space-x-6 font-semibold">
    <a href="index.html" class="hover:text-pink-600 transition">Home</a>
   <a href="#servicos"class="hover:text-pink-600 transition">Serviços</a>  
    <a href="agendamento.html" class="hover:text-pink-600 transition">Agendamentos</a>
</nav>

<div class="flex items-center bg-white rounded-full px-3 py-1 shadow-md">
    <input 
        type="text" 
        placeholder="Pesquisar..." 
        class="outline-none text-sm px-2 w-[120px] md:w-[180px]"
    >
    
    <svg xmlns="http://www.w3.org/2000/svg" 
         class="w-5 h-5 text-gray-600 cursor-pointer hover:text-pink-500"
         fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
              d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z" />
    </svg>
</div>



    </header>

<body class="bg-[#ECEDD1] flex justify-center items-center h-screen">

<div class="bg-white p-8 rounded-xl shadow-lg text-center w-[350px]">

  <img id="img" class="w-40 mx-auto mb-4">

  <h2 id="nome" class="text-xl font-bold mb-2"></h2>

  <p id="preco" class="text-pink-500 font-bold text-lg mb-4"></p>


  <input type="number" id="qtd" value="1" min="1"
  class="border p-2 w-full mb-4 rounded">

  <p class="font-bold mb-4">
    Total: <span id="total"></span>
  </p>

  <button onclick="finalizar()"
  class="bg-pink-400 text-white px-6 py-2 rounded-lg">
    Comprar
  </button>

  <p id="msg" class="mt-4 text-green-600 font-semibold"></p>

</div>

<script>
const produto = JSON.parse(localStorage.getItem("produto"));

document.getElementById("nome").innerText = produto.nome;
document.getElementById("preco").innerText = "R$ " + produto.preco.toFixed(2);
document.getElementById("img").src = produto.img;

function atualizar() {
  let qtd = document.getElementById("qtd").value;
  let total = qtd * produto.preco;
  document.getElementById("total").innerText = "R$ " + total.toFixed(2);
}

document.getElementById("qtd").addEventListener("input", atualizar);

atualizar();

function finalizar() {
  document.getElementById("msg").innerText = "Compra realizada 💖";
}
</script>

</body>
</html>
