<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Compra</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#ECEDD1] flex justify-center items-center h-screen">

<div class="bg-white p-8 rounded-xl shadow-lg text-center w-[350px]">

  <img id="img" class="w-40 mx-auto mb-4">

  <h2 id="nome" class="text-xl font-bold mb-2"></h2>

  <p id="preco" class="text-pink-500 font-bold text-lg mb-4"></p>

  <!-- QUANTIDADE -->
  <input type="number" id="qtd" value="1" min="1"
  class="border p-2 w-full mb-4 rounded">

  <!-- TOTAL -->
  <p class="font-bold mb-4">
    Total: <span id="total"></span>
  </p>

  <button onclick="finalizar()"
  class="bg-pink-400 text-white px-6 py-2 rounded-lg">
    Comprar
  </button>

  <p id="msg" class="mt-4 text-green-600 font-semibold"></p>

</div>

<script>
const produto = JSON.parse(localStorage.getItem("produto"));

document.getElementById("nome").innerText = produto.nome;
document.getElementById("preco").innerText = "R$ " + produto.preco.toFixed(2);
document.getElementById("img").src = produto.img;

function atualizar() {
  let qtd = document.getElementById("qtd").value;
  let total = qtd * produto.preco;
  document.getElementById("total").innerText = "R$ " + total.toFixed(2);
}

document.getElementById("qtd").addEventListener("input", atualizar);

atualizar();

function finalizar() {
  document.getElementById("msg").innerText = "Compra realizada 💖";
}
</script>

</body>
</html>
